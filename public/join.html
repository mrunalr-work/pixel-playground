<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Pixel Playground</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--bg:#0d0d15;--panel:#171725;--ink:#f4f0dc;--muted:#aaa7ba;--a:#ffcc33;--line:#4a4765;--g:#55e6a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background-image:linear-gradient(rgba(13,13,21,.52),rgba(13,13,21,.52)),url('/background.png');background-size:cover;background-position:center;color:var(--ink);font:24px 'VT323';display:grid;place-items:center;padding:20px}.box{width:min(560px,100%);background:var(--panel);border:4px solid var(--line);padding:28px;text-align:center;box-shadow:9px 9px #07070b}.logo{font:24px 'Press Start 2P';color:var(--a);text-shadow:3px 3px #5c3e00;line-height:1.7}.desc{color:var(--muted)}input{width:100%;background:#09090f;color:var(--ink);border:3px solid var(--line);padding:11px;font:inherit;margin:12px 0}.btn{border:3px solid var(--ink);background:var(--a);padding:11px 16px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:4px 4px #6b4a00}.status{color:var(--g);min-height:28px;margin-top:14px}
</style>
</head>
<body><div class="box"><div class="logo">PIXEL PLAYGROUND</div><h2>JOIN GAME</h2><p class="desc" id="roomText"></p><input id="name" maxlength="16"><button class="btn" id="joinBtn">JOIN SESSION</button><div class="status" id="status"></div></div>
<script>
const room=location.pathname.split("/").filter(Boolean).pop()||"";
const name=document.getElementById("name"),status=document.getElementById("status"),roomText=document.getElementById("roomText");
name.value="PLAYER_"+Math.floor(10+Math.random()*90);
roomText.textContent=`Room ${room.toUpperCase()} — enter a username to join.`;
function go(){const n=(name.value||"PLAYER").trim().replace(/[^a-zA-Z0-9_-]/g,"").slice(0,16)||"PLAYER";location.href=`/arcade.html?room=${encodeURIComponent(room)}&name=${encodeURIComponent(n)}`}
document.getElementById("joinBtn").onclick=go;
name.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script>
<footer style="position:fixed;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;pointer-events:none;font:16px VT323;color:#ddd;text-shadow:2px 2px #07070b"><span style="background:rgba(13,13,21,.82);border:1px solid #343149;padding:5px 9px">🎮 DEVELOPED BY MRUNAL</span><span id="clock" style="background:rgba(13,13,21,.82);border:1px solid #343149;padding:5px 9px">--/--/----</span></footer><script>function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("clock").textContent=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} • ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}tick();setInterval(tick,1000);</script></body></html>
