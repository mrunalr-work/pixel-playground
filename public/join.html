<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Pixel Playground</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
body{margin:0;min-height:100vh;background:radial-gradient(circle,#282844,#101018 60%,#08080d);color:#f5f1dc;font:24px 'VT323';display:flex;align-items:center;justify-content:center}.box{width:min(560px,90%);background:#181827;border:4px solid #4c4968;padding:28px;text-align:center;box-shadow:9px 9px #07070b}.logo{font:24px 'Press Start 2P';color:#ffcc33;text-shadow:3px 3px #5d3b00;line-height:1.7}input{width:100%;box-sizing:border-box;background:#09090f;color:#f5f1dc;border:3px solid #4c4968;padding:10px;font:inherit;margin:12px 0}.btn{border:3px solid #f5f1dc;background:#ffcc33;padding:10px 15px;font:inherit;font-weight:bold;box-shadow:4px 4px #6b4b00;cursor:pointer}.status{color:#55e6a5;margin-top:15px}
</style></head><body><div class="box"><div class="logo">PIXEL PLAYGROUND</div><h2>JOIN GAME</h2><p id="game">Loading room...</p><input id="name" maxlength="16"><button class="btn" onclick="join()">JOIN SESSION</button><div class="status" id="s"></div></div>
<script>
const parts=location.pathname.split("/").filter(Boolean);const room=parts[parts.length-1];const names={rps:"Rock Paper Scissors",ttt:"Tic-Tac-Toe",pong:"Pong"};name.value="PLAYER_"+Math.floor(10+Math.random()*90);game.textContent=`Room ${room} — enter your username to join.`;function join(){const n=name.value.trim().replace(/[^a-zA-Z0-9_-]/g,"").slice(0,16)||"PLAYER";location.href=`/arcade.html?room=${encodeURIComponent(room)}&name=${encodeURIComponent(n)}`}
</script></body></html>
