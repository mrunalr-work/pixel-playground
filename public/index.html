<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Playground</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');:root{--ink:#f4f0dc;--a:#ffcc33}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171725}body{min-height:100vh;color:var(--ink);font:23px 'VT323',monospace;background-image:linear-gradient(rgba(13,13,21,.48),rgba(13,13,21,.48)),url('/background.png');background-size:cover;background-position:center;background-attachment:fixed}.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;background:radial-gradient(circle at center,#232238 0%,#171725 65%,#12121c 100%)}.logo{font:clamp(25px,4.5vw,48px) 'Press Start 2P';line-height:1.5;color:var(--a);text-shadow:5px 5px #5c3e00;margin-bottom:35px}.hero p{margin:0 0 34px;color:var(--ink);font-size:clamp(22px,2.4vw,31px);letter-spacing:1px}.btn{border:3px solid var(--ink);background:var(--a);color:#17130a;padding:13px 20px;font:24px 'VT323',monospace;font-weight:bold;cursor:pointer;box-shadow:5px 5px #6b4a00}.site-footer{position:fixed;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;pointer-events:none;font:16px VT323;color:#ddd;text-shadow:2px 2px #07070b}.site-footer span{background:rgba(13,13,21,.82);border:1px solid #343149;padding:5px 9px}</style></head><body><main class="hero"><div class="logo">PIXEL PLAYGROUND</div><p>17 small retro games. Pick one, play solo, or challenge a friend online</p><button class="btn" onclick="location.href='/arcade.html'">ENTER ARCADE</button></main><footer class="site-footer"><span>🎮 MADE BY MRU</span><span id="clock">--/--/----</span></footer>
<script>function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("clock").textContent=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} • ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}tick();setInterval(tick,1000);</script></body></html>
