<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Playground</title><style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--ink:#f4f0dc;--a:#ffcc33;--line:#4a4765}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0d0d15}
body{
  min-height:100vh;color:var(--ink);font:23px 'VT323',monospace;
  background-image:linear-gradient(rgba(13,13,21,.40),rgba(13,13,21,.40)),url('/background.png');
  background-size:cover;background-position:center;background-attachment:fixed;overflow-x:hidden
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.026) 0 1px,transparent 1px 4px);opacity:.3}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.34));animation:flicker 7s steps(1,end) infinite}
@keyframes flicker{94%{opacity:.7}95%{opacity:.9}96%{opacity:.75}}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;background:linear-gradient(rgba(13,13,21,.20),rgba(13,13,21,.35));position:relative;z-index:6}
.logo{font:clamp(25px,4.5vw,48px) 'Press Start 2P';line-height:1.5;color:var(--a);text-shadow:5px 5px #5c3e00;margin-bottom:25px}
.hero p{margin:0 0 25px;color:var(--ink);font-size:clamp(22px,2.4vw,31px);letter-spacing:1px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:3px solid var(--ink);background:var(--a);color:#17130a;padding:13px 20px;font:24px 'VT323',monospace;font-weight:bold;cursor:pointer;box-shadow:5px 5px #6b4a00;transition:transform .08s,box-shadow .08s}
.btn.alt{background:#171725;color:var(--ink);box-shadow:5px 5px #07070b}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px #07070b}
.insert{margin-top:24px;font:15px 'Press Start 2P';color:var(--a);animation:blink .7s steps(2,end) infinite}
@keyframes blink{50%{opacity:.3}}
.site-footer{position:fixed;left:14px;right:14px;bottom:10px;z-index:10;display:flex;justify-content:space-between;pointer-events:none;font:16px VT323;color:#ddd;text-shadow:2px 2px #07070b}.site-footer span{background:rgba(13,13,21,.82);border:1px solid #343149;padding:5px 9px}
</style></head><body><main class="hero">
  <div class="logo">PIXEL PLAYGROUND</div>
  <p>17 small retro games. Pick one, play solo, or challenge a friend online</p>
  <div class="actions">
    <button class="btn" onclick="location.href='/arcade.html'">ENTER ARCADE</button>
    <button class="btn" onclick="location.href='/arcade.html?quick=1'">⚡ QUICK PLAY</button>
    <button class="btn alt" onclick="location.href='/arcade.html?random=1'">RANDOM GAME</button>
  </div>
  <div class="insert">INSERT COIN • PLAYER 1</div>
</main><footer class="site-footer"><span>🎮 MADE BY MRU</span><span id="clock">--/--/----</span></footer>
<script>function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("clock").textContent=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} • ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}tick();setInterval(tick,1000);</script></body></html>
