<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Playground</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--bg:#0d0d15;--panel:#171725;--ink:#f4f0dc;--muted:#aaa7ba;--a:#ffcc33;--g:#55e6a5;--line:#4a4765}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#292844,#0d0d15 62%);color:var(--ink);font:23px 'VT323',monospace;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{text-align:center;padding:42px 12px 30px}.logo{font:30px 'Press Start 2P';line-height:1.7;color:var(--a);text-shadow:4px 4px #5c3e00}.hero p{color:var(--muted);font-size:28px}.btn{border:3px solid var(--ink);background:var(--a);color:#17130a;padding:11px 16px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:4px 4px #6b4a00}.panel{border:3px solid var(--line);background:var(--panel);padding:18px;box-shadow:7px 7px #07070b}.panel h2{font:14px 'Press Start 2P';color:var(--a);line-height:1.7}.games{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.game{background:#11111b;color:var(--ink);border:2px solid var(--line);padding:13px;text-align:left;font:inherit;cursor:pointer}.game:hover{border-color:var(--a);transform:translateY(-2px)}.game small{display:block;color:var(--muted);margin-top:5px}.online{color:var(--g)}@media(max-width:900px){.games{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.games{grid-template-columns:1fr}.logo{font-size:22px}}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="logo">PIXEL PLAYGROUND</div><p>16 small retro games. Pick one, play solo, or challenge a friend online.</p><button class="btn" onclick="location.href='/arcade.html'">ENTER ARCADE</button></section>
<section class="panel"><h2>THE ARCADE</h2><div class="games" id="games"></div></section>
</div>
<script>
const games=["Click Counter","Reaction Timer","Rock Paper Scissors","Guess the Number","Tic-Tac-Toe","Memory Card Match","Whack-a-Mole","Button Dodger","Color Guessing Game","Typing Speed Game","Snake","Pong","Breakout","Flappy Bird Clone","Doodle Jump Clone","2048"];
const online=new Set([2,4,11]);
const el=document.getElementById("games");
games.forEach((name,i)=>{const b=document.createElement("button");b.className="game";b.innerHTML=`<b>${String(i+1).padStart(2,"0")} — ${name}</b><small class="${online.has(i)?"online":""}">${online.has(i)?"● ONLINE MULTIPLAYER":"SOLO"}</small>`;b.onclick=()=>location.href=`/arcade.html?game=${i}`;el.appendChild(b)});
</script>
</body></html>
